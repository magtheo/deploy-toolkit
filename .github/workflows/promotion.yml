# Reusable promotion-classification workflow for Deploy Toolkit consumers.
#
# This is the promotion-aware CI path (docs/promotion-ci-plan.md): one
# semantic engine, three frontends. Application CI qualifies source;
# promotion CI authorizes a transition between already-qualified immutable
# release state. This workflow classifies which one a transition is — it
# never qualifies source and never authorizes a merge.
#
#   classification   promotion_only   meaning
#   --------------   --------------   --------------------------------------
#   PROMOTION        true             valid promotion-only transition
#   ORDINARY         false            ordinary source/admin change: full CI
#   INVALID          false            mixed/malformed: full CI AND gate fail
#   ERROR            false            cannot classify: gate fail; never
#                                     publishes; red run (sentinel below)
#
# The classifier REPORTS; the caller's gate decides. Patterns:
#
#   # routing (cost) — inside the consumer's own ci.yml. The condition
#   # MUST be status-aware: GitHub treats skipped jobs as satisfied
#   # required checks, so a plain output test would let a failed classify
#   # job skip application CI entirely — a full-CI bypass. Uncertainty
#   # means the expensive path. The calling job MUST grant the permission
#   # floor (a called workflow cannot elevate past its caller; the floor
#   # carries the three read scopes the classifier needs — contents for
#   # API reads, checks for check-run evidence, packages for ghcr.io
#   # authentication against private caller-repository packages).
#   # Publication uses an explicit ALLOW-LIST of decisive
#   # non-promotion classifications: ERROR means "could not determine",
#   # and any state added later must fail closed, never auto-publish:
#   classify:
#     permissions:
#       contents: read
#       checks: read
#       packages: read
#     uses: magtheo/deploy-toolkit/.github/workflows/promotion.yml@<full-sha>
#   test:
#     needs: classify
#     if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.promotion_only != 'true') }}
#   publish:
#     needs: classify
#     if: >-
#       ${{
#         !cancelled() && github.event_name == 'push' &&
#         needs.classify.result == 'success' &&
#         (
#           needs.classify.outputs.classification == 'ORDINARY' ||
#           needs.classify.outputs.classification == 'INVALID'
#         )
#       }}
#   classifier-integrity:
#     # Reported ERROR leaves the classify job green (the classifier
#     # reports; it does not rule) — this sentinel makes uncertainty
#     # visibly RED anyway: a push whose classification is ERROR or whose
#     # classify job failed is a red run requiring a rerun.
#     needs: classify
#     if: ${{ !cancelled() }}
#     steps:
#       - run: |
#           case "${{ needs.classify.result }}/${{ needs.classify.outputs.classification }}" in
#             success/PROMOTION|success/ORDINARY|success/INVALID)
#               echo "decisive classification"; exit 0 ;;
#             *)
#               echo "::error::classification is not decisive — rerun required"; exit 1 ;;
#           esac
#
#   # authority (required check) — caller workflow on pull_request_target:
#   gate:
#     needs: classify
#     if: always()   # a broken classifier must never skip the gate
#     steps: fail unless classification == PROMOTION or ORDINARY
#
# Never `paths-ignore`: a whole workflow skipped by filters leaves required
# checks pending; jobs skipped by `if:` report Skipped, which satisfies
# branch protection deterministically — which is exactly why the routing
# conditions above must be status-aware.
#
# Publication is stricter than qualification: artifact publication uses an
# explicit allow-list of decisive non-promotion classifications
# (ORDINARY, INVALID). PROMOTION merges never publish; ERROR and
# machinery failures publish nothing — full tests run and the
# classifier-integrity sentinel keeps the run red until a rerun decides.
# That is what makes "promotion merge commits are unreleasable" hold under
# every classifier outcome, not just the fast path.
#
# Trust model:
#
#   - PR code is NEVER executed. The trusted build is isolated on disk:
#     the toolkit is checked out into toolkit/ and deployctl is built
#     (with GOWORK=off, so no parent go.work can redirect dependency
#     resolution) BEFORE the consumer content is checked out into the
#     sibling consumer/. The classifier reads commits, trees and
#     manifests through the GitHub API, and the new-release evidence path
#     reads only the release's pinned source revision — a main-qualified
#     SHA — via `git cat-file`. deployctl is built from
#     job.workflow_repository@job.workflow_sha — the exact commit of this
#     workflow, the single machinery trust anchor. There is deliberately
#     no caller-supplied toolkit ref input.
#   - No caller-supplied secrets: the implicit GITHUB_TOKEN (read scopes
#     only) suffices for API reads, so classification from fork PRs works.
#     The caller's floor also grants packages:read, and the classify job
#     turns that same ephemeral token into an ephemeral ghcr.io Docker
#     config (DOCKER_CONFIG under RUNNER_TEMP) that authn.DefaultKeychain
#     picks up — so release artifacts in private GHCR packages ACCESSIBLE
#     TO THE CALLER REPOSITORY'S GITHUB_TOKEN (normally the caller's own
#     linked/inherited packages; Actions access can also be granted per
#     package) resolve without any PAT, workflow secret or write scope.
#     packages:read alone grants nothing — GitHub's package access control
#     is separate from the token's scope. Only ghcr.io is authenticated;
#     anonymous registries keep working. Other private registries remain
#     outside v1 (operator side: `promotion check`/`classify` from a
#     machine with a configured keychain; in CI they would need a
#     separately defined authentication contract).
#   - runs-on is hardcoded to ubuntu-latest: the never-executes-PR-code
#     property must not accidentally land on consumer self-hosted runners
#     with persistent access to deployment material.
#
# Failure semantics — uncertainty means the expensive path, never the
# published path, and it is always visibly red:
#
#   - Reported classifications (CLI exit 0 PROMOTION, 1 ORDINARY/INVALID,
#     3 ERROR) ALWAYS conclude success and ALWAYS set the outputs. Only
#     PROMOTION routes past the expensive path (tests and publish) —
#     every other result, and every machinery failure (checkout/build
#     errors, unsupported event, usage error, unparsable output, which
#     leave outputs absent and fail the run), routes consumer test jobs
#     to the expensive path via the status-aware conditions above, and
#     the caller's always() gate still blocks. Publication uses an
#     explicit allow-list of decisive non-promotion classifications
#     (ORDINARY, INVALID): an ERROR or machinery failure qualifies but
#     publishes nothing, and the consumer's classifier-integrity sentinel
#     keeps the run red until a rerun decides.
#
# Events: pull_request and pull_request_target classify the PR transition
# (base → head, full compare-and-swap rules); push classifies the ref
# transition (github.event.before → github.event.after; a stale or
# force-pushed transition never classifies as a promotion). Any other
# triggering event is a machinery failure. Inputs base/head override the
# event-derived SHAs for explicit callers; repo_dir selects the consumer
# repository checkout holding .deploy/ (default ".") — v1 requires
# .deploy/ at the repository root, one project per repository.

name: Promotion classify

on:
  workflow_call:
    inputs:
      base:
        description: Override base SHA (pr trusted base / push.before). Defaults to the triggering event.
        required: false
        type: string
        default: ""
      head:
        description: Override head SHA (pr PR head / push.after). Defaults to the triggering event.
        required: false
        type: string
        default: ""
      repo_dir:
        description: Consumer repository checkout root holding .deploy/ (default ".")
        required: false
        type: string
        default: "."
    outputs:
      promotion_only:
        description: "true only when the classification is PROMOTION; false otherwise (always set)"
        value: ${{ jobs.classify.outputs.promotion_only }}
      classification:
        description: "PROMOTION | ORDINARY | INVALID | ERROR (always set)"
        value: ${{ jobs.classify.outputs.classification }}
      reason:
        description: "Human-readable reason for the classification (always set)"
        value: ${{ jobs.classify.outputs.reason }}

# The workflow grants nothing by default; the job declares its own
# least-privilege scope.
permissions: {}

jobs:
  classify:
    name: classify (trusted code, no caller-supplied secrets, never PR code)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      packages: read
    outputs:
      promotion_only: ${{ steps.classify.outputs.promotion_only }}
      classification: ${{ steps.classify.outputs.classification }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Fail closed unless this workflow was invoked by full SHA
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          case "${WORKFLOW_REF##*@}" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error::invoke this workflow pinned to a full 40-hex commit SHA (uses: ...@<full-sha>); a floating ref is not a trust anchor"; exit 1 ;;
          esac

      # Trusted build FIRST, before any PR-controlled content exists on
      # disk, in a dedicated directory: a parent go.work of the consumer
      # checkout must never influence dependency resolution.
      - name: Check out exactly the toolkit commit running this workflow
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: toolkit
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@34829cb9acb0c3aab260216f67d0867cc080dca5
        with:
          go-version-file: toolkit/go.mod

      - name: Build deployctl from the workflow's own toolkit commit
        working-directory: toolkit
        env:
          GOWORK: off
        run: go build -o /tmp/deployctl ./cmd/deployctl

      # Consumer content lands in a SIBLING directory, data only. Full
      # history: the new-release evidence path reads the release's pinned
      # source revision — older than the transition head by construction.
      - name: Check out the consumer repository (data, never executed)
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          path: consumer
          persist-credentials: false
          fetch-depth: 0

      - name: Classify the transition (reported, never ruled)
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_HEAD: ${{ inputs.head }}
          EVENT_PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_PUSH_BEFORE: ${{ github.event.before }}
          EVENT_PUSH_AFTER: ${{ github.event.after }}
          REPO_DIR: ${{ inputs.repo_dir }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Ephemeral ghcr.io credential from the caller's own implicit
          # token (the job holds packages:read): resolves private GHCR
          # packages accessible to the caller repository's GITHUB_TOKEN
          # (normally the caller's linked/inherited packages; access
          # control is GitHub-side per package and packages:read grants
          # nothing by itself). DOCKER_CONFIG redirects
          # authn.DefaultKeychain to this RUNNER_TEMP config;
          # only ghcr.io is listed, so every other registry stays
          # anonymous. No PAT, no secret input, no write scope; wiped
          # when the step exits.
          export DOCKER_CONFIG="$RUNNER_TEMP/.docker"
          mkdir -p "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64 | tr -d '\n')" \
            > "$DOCKER_CONFIG/config.json"
          chmod 600 "$DOCKER_CONFIG/config.json"

          case "$EVENT_NAME" in
            pull_request|pull_request_target)
              mode=pr
              event_base="$EVENT_PR_BASE"
              event_head="$EVENT_PR_HEAD"
              ;;
            push)
              mode=push
              event_base="$EVENT_PUSH_BEFORE"
              event_head="$EVENT_PUSH_AFTER"
              ;;
            *)
              echo "::error::promotion.yml classifies pull_request, pull_request_target and push events only (got: $EVENT_NAME) — machinery failure; fix the caller wiring, then rerun"
              exit 1
              ;;
          esac

          base="${INPUT_BASE:-$event_base}"
          head="${INPUT_HEAD:-$event_head}"
          repo_dir="$GITHUB_WORKSPACE/consumer/$REPO_DIR"
          scratch="$RUNNER_TEMP/classify.json"

          set +e
          /tmp/deployctl promotion classify \
            --repo "$REPO" \
            --mode "$mode" \
            --base "$base" \
            --head "$head" \
            --repo-dir "$repo_dir" \
            --json > "$scratch"
          code=$?
          set -e

          # The classifier reports; it never rules. Reported
          # classifications (exit 0 PROMOTION, 1 ORDINARY/INVALID, 3
          # ERROR) always set the outputs and always conclude success:
          # the caller's status-aware routing conditions and always()
          # gate own the decision. Exit 2 (usage error) or anything
          # without a parseable result is workflow machinery failure:
          # outputs stay absent and the step fails — the routing falls
          # back to the expensive path and the gate blocks.
          case "$code" in
            0|1|3) ;;
            *)
              cat "$scratch" >&2 || true
              echo "::error::promotion classify machinery failure (exit $code): usage error or crash — fix the caller wiring, then rerun"
              exit 1
              ;;
          esac
          classification="$(jq -er '.classification' "$scratch")" || {
            echo "::error::promotion classify produced no parseable result (exit $code)"
            exit 1
          }
          promotion_only="$(jq -er '.promotionOnly | tostring' "$scratch")"
          reason="$(jq -er '.reason' "$scratch")"

          # GitHub's fixed-delimiter warning: never emit a fixed heredoc
          # terminator for operator-influenced values. Generate a random
          # delimiter and regenerate on the (astronomically unlikely)
          # collision with the reason text.
          gen_delim() {
            printf 'PROMOTION_REASON_%s' "$(head -c 256 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20)"
          }
          reason_delim="$(gen_delim)"
          while printf '%s\n' "$reason" | grep -qF "$reason_delim"; do
            reason_delim="$(gen_delim)"
          done

          {
            echo "classification=$classification"
            echo "promotion_only=$promotion_only"
            echo "reason<<$reason_delim"
            echo "$reason"
            echo "$reason_delim"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### promotion classification'
            echo ''
            echo '```'
            echo "classification: $classification"
            echo "promotion_only: $promotion_only"
            echo "reason: $reason"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0
