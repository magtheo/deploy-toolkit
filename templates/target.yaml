apiVersion: deploy.toolkit/v1
kind: Target

metadata:
  name: production-primary

spec:
  # Absolute directory the toolkit owns on the target. Everything else is
  # derived: <deployRoot>/<project>/releases, .../state, .../history.
  deployRoot: /srv/deploy

  transport:
    type: ssh

    # The manifest names environment variables; the environment holds the
    # values. hostFrom's value is the hostname. hostKeyFrom and
    # credentialFrom name variables whose VALUES are file PATHS:
    # credentialFrom points at the SSH private-key file, hostKeyFrom at a
    # file holding the pinned host key (authorized_keys format). Secret
    # material itself never lives in this manifest or in Git.
    hostFrom: DEPLOY_HOST
    port: 22
    user: deploy

    hostKeyFrom: DEPLOY_HOST_KEY
    credentialFrom: DEPLOY_SSH_KEY
